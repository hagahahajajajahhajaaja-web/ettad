name: ETAAD CI

# فحص فقط — لا يوجد أي نشر في هذا المسار.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build (static export)
        run: npm run build
      - name: Install browsers (Chromium + WebKit for iPhone Safari)
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (iPhone + desktop + WebKit)
        run: npm run test:e2e
        env:
          E2E_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
